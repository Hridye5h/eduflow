# Render Blueprint — provisions API + Postgres
# Push to GitHub then go to Render → New → Blueprint → connect repo.
#
# Notes for first deploy:
# - Uses --no-frozen-lockfile so the build works without a committed pnpm-lock.yaml.
#   Render will generate its own lockfile during install.
# - Uses `prisma db push` (no migration history). For a pilot with a fresh DB this
#   is fine. Once you have real data, generate migrations and switch to
#   `prisma migrate deploy`.
# - healthCheckPath wakes the dyno; Render pings /health on cold-start.

databases:
  - name: eduflow-db
    plan: free
    databaseName: eduflow
    user: eduflow

services:
  - type: web
    name: eduflow-api
    runtime: node
    plan: free
    rootDir: apps/api
    healthCheckPath: /health
    buildCommand: cd ../.. && npm i -g pnpm@9 && NODE_ENV=development pnpm install --no-frozen-lockfile && cd apps/api && pnpm exec prisma generate && pnpm exec prisma db push --accept-data-loss --skip-generate && pnpm run build
    startCommand: node dist/src/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduflow-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: ENABLE_SWAGGER
        value: "false"
      # NEVER set ENABLE_TEST_HELPERS=true in production — it exposes plaintext OTPs.
      - key: ENABLE_TEST_HELPERS
        value: "false"
      - key: CORS_ORIGINS
        sync: false        # set in dashboard: comma list incl. your vercel URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
